name: Publish GitHub Wiki

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export pages with native Wiki links
        run: python tools/wiki/export_github_wiki.py "$RUNNER_TEMP/novadyne-wiki"
      - name: Publish to GitHub Wiki
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" "$RUNNER_TEMP/github-wiki"
          cp "$RUNNER_TEMP/novadyne-wiki/"*.md "$RUNNER_TEMP/github-wiki/"
          cd "$RUNNER_TEMP/github-wiki"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.md'
          if git diff --cached --quiet; then
            echo 'Wiki already up to date.'
          else
            git commit -m 'docs: sync NovaDyne wiki'
            git push origin HEAD
          fi
