name: Wiki

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install wiki dependency
        run: python -m pip install -r tools/wiki/requirements.txt
      - name: Check wiki sources, pages, images and links
        run: python tools/wiki/generate.py --check
      - name: Check native GitHub Wiki export
        run: python tools/wiki/export_github_wiki.py "$RUNNER_TEMP/novadyne-wiki"
